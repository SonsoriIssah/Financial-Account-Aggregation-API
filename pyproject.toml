[project]
name = "financial-account-aggregation-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "SonsoriIssah", email = "issonsori@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.1",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "redis>=5.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
financial-account-aggregation-api = "financial_account_aggregation_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "anyio>=4",
    "fakeredis>=2.26",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]
